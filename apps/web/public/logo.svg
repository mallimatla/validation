<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60">
  <defs>
    <!-- Shield gradient -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22D3EE"/>
      <stop offset="50%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#0891B2"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Checkmark gradient -->
    <linearGradient id="checkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ADE80"/>
      <stop offset="100%" style="stop-color:#22C55E"/>
    </linearGradient>
  </defs>

  <!-- Shield icon -->
  <g transform="translate(5, 5)">
    <!-- Shield outline with glow -->
    <path d="M25 2 L45 9 L45 22 C45 34 37 44 25 50 C13 44 5 34 5 22 L5 9 Z"
          fill="none"
          stroke="url(#shieldGradient)"
          stroke-width="2"
          filter="url(#glowEffect)"/>

    <!-- Inner shield -->
    <path d="M25 6 L42 12 L42 22 C42 32 35 40 25 46 C15 40 8 32 8 22 L8 12 Z"
          fill="#1E293B"
          opacity="0.9"/>

    <!-- Network pattern -->
    <circle cx="18" cy="16" r="1.2" fill="#22D3EE" opacity="0.5"/>
    <circle cx="32" cy="16" r="1.2" fill="#22D3EE" opacity="0.5"/>
    <circle cx="25" cy="11" r="1.2" fill="#22D3EE" opacity="0.5"/>
    <circle cx="14" cy="24" r="1.2" fill="#22D3EE" opacity="0.5"/>
    <circle cx="36" cy="24" r="1.2" fill="#22D3EE" opacity="0.5"/>
    <circle cx="25" cy="20" r="1.2" fill="#22D3EE" opacity="0.5"/>

    <!-- Network lines -->
    <line x1="18" y1="16" x2="25" y2="11" stroke="#22D3EE" stroke-width="0.5" opacity="0.3"/>
    <line x1="32" y1="16" x2="25" y2="11" stroke="#22D3EE" stroke-width="0.5" opacity="0.3"/>
    <line x1="18" y1="16" x2="25" y2="20" stroke="#22D3EE" stroke-width="0.5" opacity="0.3"/>
    <line x1="32" y1="16" x2="25" y2="20" stroke="#22D3EE" stroke-width="0.5" opacity="0.3"/>
    <line x1="14" y1="24" x2="25" y2="20" stroke="#22D3EE" stroke-width="0.5" opacity="0.3"/>
    <line x1="36" y1="24" x2="25" y2="20" stroke="#22D3EE" stroke-width="0.5" opacity="0.3"/>

    <!-- Checkmark -->
    <path d="M16 27 L22 33 L35 18"
          fill="none"
          stroke="url(#checkGradient)"
          stroke-width="3.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Text -->
  <text x="65" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#4ADE80">Validation</text>
  <text x="65" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="white">Council</text>
</svg>
