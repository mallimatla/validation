# Railway Configuration for Validation Council
# https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
healthcheckPath = "/api/v1/health/live"
healthcheckTimeout = 60
startCommand = "node -e \"process.on('uncaughtException', e => { console.error('CRASH:', e); process.exit(1); }); console.log('Loading app...'); require('./dist/main.js');\""
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production]
[environments.production.variables]
NODE_ENV = "production"
